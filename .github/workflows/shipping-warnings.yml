name: Shipping GDScript warnings
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  strict-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GAME_AUDIO_MUTED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verified Godot 4.7
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
      - name: Import project
        run: '"$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --headless --path . --editor --import --quit'
      - name: Treat all 49 warning categories as errors
        run: python3 tools/check_gdscript_warnings.py --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --artifacts "$RUNNER_TEMP/strict-audit"
